<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <base href="./../">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="description" content="CoreUI - Open Source Bootstrap Admin Template">
    <meta name="author" content="Łukasz Holeczek">
    <meta name="keyword" content="Bootstrap,Admin,Template,Open,Source,jQuery,CSS,HTML,RWD,Dashboard">
    <title>Login - AI Application</title>
    <link rel="apple-touch-icon" sizes="57x57" href="assets/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="assets/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="assets/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="assets/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="assets/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="assets/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="assets/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="assets/favicon/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
     <!-- Vendors styles-->
     <!-- <link rel="stylesheet" href="vendors/simplebar/css/simplebar.css"> -->
     <!-- <link rel="stylesheet" href="css/vendors/simplebar.css"> -->
     <!-- Main styles for this application-->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <!-- We use those styles to show code examples, you should remove them in your application.-->
    <link href="css/examples.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script src="js/color-modes.js"></script>
  </head>
  <body>
    <div class="bg-body-tertiary min-vh-100 d-flex flex-row align-items-center">
      <div class="container" style="max-width: 32rem">
        <div class="card p-4">
          <div class="card-body d-flex flex-column gap-4">
            <h2 class="h5 text-center">Login to your account</h2>
            
            <!-- Error alert -->
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                Invalid credentials. Please check your identifier and password.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
              
              <!-- Success alert for registered users -->
              <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show" role="alert">
                Registration successful! Please sign in with your new account.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
              
               <form th:action="@{/authentication/login}" method="post" autocomplete="off" novalidate>
                 <div>
                   <label class="form-label" for="username">Username or email</label>
                   <input class="form-control" id="username" name="username" type="text" placeholder="Enter username or email" autocomplete="username">
                 </div>
                 <div>
                   <div class="d-flex justify-content-between">
                     <label class="form-label" for="password">Password</label>
                   </div>
                   <input class="form-control" id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password">
                 </div>
                 <div>
                   <button class="btn btn-primary w-100" type="submit">Sign in</button>
                 </div>
               </form>
               
               <div class="text-center text-body-secondary">
                Need an account?
                <a href="/authentication/register">Sign up</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
