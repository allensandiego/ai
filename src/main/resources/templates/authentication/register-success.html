<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - AI Application</title>
    <link rel="stylesheet" th:href="@{/css/style.min.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .success-card {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,.15);
            text-align: center;
        }
        .success-icon {
            font-size: 3rem;
            color: #28a745;
            margin-bottom: 1rem;
        }
        .success-card h2 {
            color: #28a745;
            margin-bottom: 1rem;
        }
        .success-message {
            color: #6c757d;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .btn-primary {
            padding: 0.5rem 2rem;
            font-size: 1rem;
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">✓</div>
        <h2>Registration Successful!</h2>
        <p class="success-message">
            Your account has been created. You can now log in with your credentials.
        </p>
        <a th:href="@{/login}" class="btn-primary">Go to Login</a>
    </div>
</body>
</html>
